[build-system]
requires = ["setuptools>=77", "wheel", "torch==2.11.*", "nanobind>=2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-kmeans-cuda"
version = "0.1.0"
description = "Hand-rolled CUDA kernels for batched K-Means clustering (Euclidean hot path)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "flash-kmeans-cuda authors" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cuda", "kmeans", "pytorch", "tensor-cores", "triton"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: C++",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "torch==2.11.*",
  "nanobind>=2.1",
]

[project.urls]
Homepage = "https://github.com/OpsiClear/flash-kmeans-cuda"
Repository = "https://github.com/OpsiClear/flash-kmeans-cuda"
Issues = "https://github.com/OpsiClear/flash-kmeans-cuda/issues"
Upstream = "https://github.com/svg-project/flash-kmeans"

[project.optional-dependencies]
dev = ["pytest", "flash-kmeans"]

[tool.setuptools]
packages = ["flash_kmeans_cuda"]
include-package-data = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
